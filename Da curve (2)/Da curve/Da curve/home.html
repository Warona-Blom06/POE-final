    <script>
        // date and time update on the footer 
        function updateDateTime(){
            const now = new Date();
            const options = {
                weekday:'long',
                year:'numeric',
                month:'long',
                day:'numeric',
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            };
            document.getElementById('datetime').textContent = now.toLocalDateString('en-US', options);
        }
        //update date time immediatley
        updateDateTime();
        setInterval(updateDateTime, 1000);
